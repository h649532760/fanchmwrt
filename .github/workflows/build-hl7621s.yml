name: Build HL7621-S Fanchmwrt
on:
  push:
    branches: [ fanchmwrt-25.12.4 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: fanchmwrt

      - name: Install Build Dependencies
        run: |
          cd fanchmwrt
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools python3-wheel rsync swig unzip zlib1g-dev file wget

      - name: Generate .config
        run: |
          cd fanchmwrt
          make defconfig
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_hailin_hl7621-s=y" >> .config
          echo "CONFIG_KERNEL_DEBUG_INFO=n" >> .config
          echo "CONFIG_KERNEL_DEBUG_FS=n" >> .config
          echo "CONFIG_KERNEL_KGDB=n" >> .config
          echo "CONFIG_PACKAGE_kmod-pcie-mt=m" >> .config
          echo "CONFIG_PACKAGE_kmod-ath9k=m" >> .config
          echo "CONFIG_PACKAGE_kmod-usb3=m" >> .config
          echo "CONFIG_PACKAGE_kmod-sdhci-mt7620=m" >> .config
          echo "CONFIG_PACKAGE_kmod-i2c-gpio=m" >> .config
          echo "CONFIG_PACKAGE_kmod-rtc-pcf8563=m" >> .config
          make oldconfig

      - name: Compile Firmware
        run: |
          cd fanchmwrt
          make -j$(nproc)

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HL7621S-Firmware
          path: fanchmwrt/bin/targets/ramips/mt7621/
