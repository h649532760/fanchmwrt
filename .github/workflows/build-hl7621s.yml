# .github/workflows/openwrt-build.yml
# OpenWrt 固件构建工作流 (MT7621 / Hailin HL7621-S)
# 确保 initramfs-kernel.bin 正确生成并上传

name: OpenWrt Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:  # 支持手动触发

env:
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-p1.sh
  DIY_P2_SH: diy-p2.sh

jobs:
  build:
    name: OpenWrt Firmware Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Load default config
        run: |
          # 加载目标平台的默认配置
          make defconfig TARGET=ramips SUBTARGET=mt7621 PROFILE=hl7621-s

      - name: Check and fix initramfs config
        run: |
          echo ""
          echo "===== 检查 initramfs 相关配置 ====="
          grep -E "TARGET_ROOTFS_INITRAMFS|KERNEL_INITRAMFS|KERNEL_LZMA|TARGET_PROFILE" .config || echo "WARNING: 未找到相关配置"
          echo ""
          echo "===== 确保 CONFIG_TARGET_ROOTFS_INITRAMFS=y ====="
          # 如果未设置则追加
          grep -q "CONFIG_TARGET_ROOTFS_INITRAMFS=y" .config || echo "CONFIG_TARGET_ROOTFS_INITRAMFS=y" >> .config
          echo ""
          echo "===== 确保 CONFIG_KERNEL_LZMA=y ====="
          grep -q "CONFIG_KERNEL_LZMA=y" .config || echo "CONFIG_KERNEL_LZMA=y" >> .config
          echo ""
          echo "===== 确保 CONFIG_KERNEL_INITRAMFS_SOURCE 已设置 ====="
          grep "CONFIG_KERNEL_INITRAMFS_SOURCE" .config || echo "CONFIG_KERNEL_INITRAMFS_SOURCE=\"\"" >> .config
          echo ""
          echo "===== 最终相关配置 ====="
          grep -E "CONFIG_TARGET_ROOTFS_INITRAMFS|CONFIG_KERNEL_INITRAMFS|CONFIG_KERNEL_LZMA" .config
          make defconfig

      - name: Download packages
        run: |
          echo "下载构建依赖包..."
          make download -j$(nproc) DOWNLOAD_RETRIES=3 || true

      - name: Build firmware
        id: build
        run: |
          echo "开始构建固件..."
          make -j$(nproc) || make -j1 V=s
          echo "构建完成"

      - name: Verify build output
        id: verify
        run: |
          echo ""
          echo "===== 构建产物列表 ====="
          ls -lh bin/targets/ramips/mt7621/ 2>/dev/null || echo "ERROR: 产物目录不存在"
          echo ""
          echo "===== 检查 initramfs 镜像 ====="
          if [ -f bin/targets/ramips/mt7621/*-initramfs-kernel.bin ]; then
            echo "SUCCESS: initramfs-kernel.bin 已生成"
            ls -lh bin/targets/ramips/mt7621/*-initramfs-kernel.bin
            INITRAMFS_SIZE=$(stat -c%s bin/targets/ramips/mt7621/*-initramfs-kernel.bin 2>/dev/null || echo "0")
            echo "文件大小(字节): $INITRAMFS_SIZE"
            if [ "$INITRAMFS_SIZE" -gt 10485760 ]; then
              echo "SUCCESS: 文件大小 > 10MB，initramfs 打包正常"
            else
              echo "WARNING: 文件大小 <= 10MB，initramfs 可能未正确打包"
            fi
          else
            echo "ERROR: initramfs-kernel.bin 未找到"
            echo "尝试查找所有 bin 文件:"
            find bin/targets/ -name "*.bin" -type f 2>/dev/null
          fi
          echo ""
          echo "===== 检查所有内核镜像 ====="
          find bin/targets/ -name "*kernel*" -type f -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mt7621-hl7621-s
          path: |
            bin/targets/ramips/mt7621/
          retention-days: 14
          if-no-files-found: error

      - name: Upload config artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-config
          path: |
            .config
            .config.old
            feeds/base-files/lib/sdk/Makefile.build
          retention-days: 7

      - name: Post-build summary
        if: always()
        run: |
          echo "===== 构建总结 ====="
          echo "工作流触发方式: ${{ github.event_name }}"
          echo "分支: ${{ github.ref_name }}"
          echo ""
          echo "产物目录内容:"
          ls -lh bin/targets/ramips/mt7621/ 2>/dev/null || echo "目录不存在"
          echo ""
          echo "initramfs 状态:"
          if [ -f bin/targets/ramips/mt7621/*-initramfs-kernel.bin ]; then
            echo "initramfs-kernel.bin: 已生成"
          else
            echo "initramfs-kernel.bin: 未生成"
          fi 
