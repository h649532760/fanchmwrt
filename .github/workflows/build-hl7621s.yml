# =============================================================================
# Hailin HL7621-S 4G Router - FanchmWrt 云编译工作流
# 源码: https://github.com/fanchmwrt/fanchmwrt
# 分支: fanchmwrt-25.12.4 (基于 OpenWrt 25.12)
#
# 硬件：MT7621AT + 256MB + 16MB Flash + Atheros AR9287 (Mini PCIe WiFi)
#        + 移远 EC20/EC25 (USB 4G) + SD + USB3.0 + RTC
#
# 使用方式：
#   1. Fork https://github.com/fanchmwrt/fanchmwrt
#   2. 在 Fork 仓库中创建 .github/workflows/build-hl7621s.yml
#   3. 将本文件内容粘贴进去
#   4. Actions → Run workflow → 等待 30-60 分钟 → 下载固件
#
# ✅ GPIO 分配（根据 PCB 丝印确认）：
#   GPIO13 = 4G 模块电源 (POWER 4G)
#   GPIO14/16 = WiFi 控制
#   GPIO19 = PERST_N (PCIe 复位，由内核自动管理)
#   4G 和 WiFi 不冲突，可同时使用
# =============================================================================

name: Build FanchmWrt for HL7621-S

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'fanchmwrt 分支'
        required: true
        default: 'fanchmwrt-25.12.4'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt purge -y '^ghc-.*' '^dotnet-.*' '^llvm-.*' '^mysql.*' || true
          sudo apt autoremove -y
          sudo apt clean
          df -h

      - name: Checkout FanchmWrt source
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-pyelftools python3-distutils \
            rsync unzip zlib1g-dev file wget qemu-utils libelf-dev

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ================================================================
      # 注入 HL7621-S 自定义设备文件
      # ================================================================

      - name: Add HL7621-S DTS file
        run: |
          cat > target/linux/ramips/dts/mt7621_hailin_hl7621-s.dts << 'DTSEOF'
          /dts-v1/;
          
          #include "mt7621.dtsi"
          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>
          #include <dt-bindings/leds/common.h>
          
          / {
          	compatible = "hailin,hl7621-s", "mediatek,mt7621-soc";
          	model = "Hailin HL7621-S";
          
          	aliases {
          		led-boot = &led_power;
          		led-failsafe = &led_power;
          		led-running = &led_power;
          		led-upgrade = &led_power;
          		label-mac-device = &gmac0;
          		serial0 = &uartlite;
          	};
          
          	chosen {
          		bootargs = "console=ttyS0,57600";
          		stdout-path = &uartlite;
          	};
          
          	leds {
          		compatible = "gpio-leds";
          
          		led_power: led-0 {
          			function = LED_FUNCTION_POWER;
          			color = <LED_COLOR_ID_BLUE>;
          			gpios = <&gpio 0 GPIO_ACTIVE_LOW>;
          		};
          
          		led-1 {
          			function = LED_FUNCTION_WLAN;
          			color = <LED_COLOR_ID_GREEN>;
          			gpios = <&gpio 1 GPIO_ACTIVE_LOW>;
          		};
          
          		led_4g: led-2 {
          			label = "green:4g";
          			gpios = <&gpio 2 GPIO_ACTIVE_LOW>;
          		};
          	};
          
          	keys {
          		compatible = "gpio-keys";
          
          		reset {
          			label = "reset";
          			gpios = <&gpio 18 GPIO_ACTIVE_LOW>;
          			linux,code = <KEY_RESTART>;
          		};
          	};
          
          	/* GPIO 导出控制（根据 PCB 丝印）
          	 * GPIO13 = 4G 模块电源 (POWER 4G)
          	 * GPIO14/16 = WiFi 控制 (由驱动自动管理)
          	 * GPIO19 = PERST_N (PCIe 复位，由内核自动管理)
          	 */
          	gpio-export {
          		compatible = "gpio-export";
          
          		modem_power {
          			gpio-export,name = "modem_power";
          			gpio-export,output = <1>;
          			gpios = <&gpio 13 GPIO_ACTIVE_HIGH>;
          		};
          	};
          
          	i2c {
          		compatible = "i2c-gpio";
          		sda-gpios = <&gpio 3 (GPIO_ACTIVE_HIGH | GPIO_OPEN_DRAIN)>;
          		scl-gpios = <&gpio 4 (GPIO_ACTIVE_HIGH | GPIO_OPEN_DRAIN)>;
          		i2c-gpio,delay-us = <5>;
          
          		rtc@51 {
          			compatible = "nxp,pcf8563";
          			reg = <0x51>;
          		};
          	};
          };
          
          &spi0 {
          	status = "okay";
          
          	flash@0 {
          		compatible = "jedec,spi-nor";
          		reg = <0>;
          		spi-max-frequency = <40000000>;
          
          		partitions {
          			compatible = "fixed-partitions";
          			#address-cells = <1>;
          			#size-cells = <1>;
          
          			partition@0 {
          				label = "u-boot";
          				reg = <0x0 0x30000>;
          				read-only;
          			};
          
          			partition@30000 {
          				label = "u-boot-env";
          				reg = <0x30000 0x10000>;
          				read-only;
          			};
          
          			factory: partition@40000 {
          				label = "factory";
          				reg = <0x40000 0x10000>;
          				read-only;
          
          				nvmem-layout {
          					compatible = "fixed-layout";
          					#address-cells = <1>;
          					#size-cells = <1>;
          
          					eeprom_factory_0: eeprom@0 {
          						reg = <0x0 0x4da8>;
          					};
          
          					eeprom_factory_8000: eeprom@8000 {
          						reg = <0x8000 0x4da8>;
          					};
          
          					macaddr_factory_e000: macaddr@e000 {
          						reg = <0xe000 0x6>;
          					};
          				};
          			};
          
          			partition@50000 {
          				compatible = "denx,uimage";
          				label = "firmware";
          				reg = <0x50000 0xfb0000>;
          			};
          		};
          	};
          };
          
          /* PCIe WiFi: Atheros AR5BHB116 (AR9287, ath9k 驱动, Mini PCIe 双频)
           * GPIO19 = PERST_N 由 PCIe 子系统自动管理 */
          &pcie {
          	status = "okay";
          };
          
          &pcie0 {
          	wifi@0,0 {
          		compatible = "pci168c,002e";
          		reg = <0x0000 0 0 0 0>;
          		nvmem-cells = <&eeprom_factory_8000>;
          		nvmem-cell-names = "eeprom";
          		ieee80211-freq-limit = <2400000 2500000>, <5000000 6000000>;
          	};
          };
          
          &gmac0 {
          	status = "okay";
          	nvmem-cells = <&macaddr_factory_e000>;
          	nvmem-cell-names = "mac-address";
          };
          
          &gmac1 {
          	status = "okay";
          	label = "wan";
          	phy-handle = <&ethphy4>;
          
          	nvmem-cells = <&macaddr_factory_e000>;
          	nvmem-cell-names = "mac-address";
          	mac-address-increment = <1>;
          };
          
          &ethphy4 {
          	/delete-property/ interrupts;
          };
          
          &switch0 {
          	ports {
          		port@0 {
          			status = "okay";
          			label = "lan1";
          		};
          
          		port@1 {
          			status = "okay";
          			label = "lan2";
          		};
          
          		port@2 {
          			status = "okay";
          			label = "lan3";
          		};
          
          		port@3 {
          			status = "okay";
          			label = "lan4";
          		};
          	};
          };
          
          &sdhci {
          	status = "okay";
          };
          
          &uartlite {
          	status = "okay";
          };
          
          &xhci {
          	status = "okay";
          };
          
          &state_default {
          	gpio {
          		groups = "wdt", "rgmii2", "jtag", "mdio", "nand";
          		function = "gpio";
          	};
          };
          DTSEOF

      - name: Add HL7621-S device definition
        run: |
          cat >> target/linux/ramips/image/mt7621.mk << 'MKEOF'
          
          define Device/hailin_hl7621-s
            $(Device/dsa-migration)
            IMAGE_SIZE := 16064k
            DEVICE_VENDOR := Hailin
            DEVICE_MODEL := HL7621-S
            DEVICE_PACKAGES := kmod-usb3 kmod-usb-storage kmod-fs-ext4 kmod-fs-ntfs \
              kmod-sdhci-mt7620 kmod-rtc-pcf8563 kmod-ath9k wpad-basic-mbedtls \
              kmod-usb-net-rndis kmod-usb-net-cdc-ether kmod-usb-serial-option kmod-usb-acm \
              modemmanager luci-proto-modemmanager usb-modeswitch usb-modeswitch-data \
              block-mount
          endef
          TARGET_DEVICES += hailin_hl7621-s
          MKEOF

      - name: Add HL7621-S network config
        run: |
          NETWORK_FILE="target/linux/ramips/mt7621/base-files/etc/board.d/02_network"
          
          if [ -f "$NETWORK_FILE" ]; then
            sed -i '/^esac$/i \
          hailin,hl7621-s)\\
          \tucidef_set_interfaces_lan_wan "lan1 lan2 lan3 lan4" "wan"\\
          \t;;' "$NETWORK_FILE"
          else
            mkdir -p target/linux/ramips/mt7621/base-files/etc/board.d/
            cat > "$NETWORK_FILE" << 'NETEOF'
          #!/bin/sh
          . /lib/functions/uci-defaults.sh
          
          board_config_update
          board=$(board_name)
          
          case "$board" in
          hailin,hl7621-s)
          	ucidef_set_interfaces_lan_wan "lan1 lan2 lan3 lan4" "wan"
          	;;
          esac
          
          board_config_flush
          exit 0
          NETEOF
            chmod +x "$NETWORK_FILE"
          fi

      # ================================================================
      # 编译配置
      # ================================================================

      - name: Generate build config
        run: |
          cat > .config << 'CONFIGEOF'
          # ========== 目标设备 ==========
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_hailin_hl7621-s=y
          
          # ========== USB 支持 ==========
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-ntfs=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_usbutils=y
          
          # ========== WiFi (Atheros AR9287, ath9k) ==========
          CONFIG_PACKAGE_kmod-ath9k=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          
          # ========== 4G 模块 (EC20/EC25) ==========
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-acm=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usb-modeswitch-data=y
          
          # ========== SD 卡 ==========
          CONFIG_PACKAGE_kmod-sdhci-mt7620=y
          
          # ========== RTC ==========
          CONFIG_PACKAGE_kmod-rtc-pcf8563=y
          
          # ========== Docker (256MB RAM) ==========
          CONFIG_PACKAGE_kmod-ipt-ipset=y
          CONFIG_PACKAGE_kmod-br-netfilter=y
          CONFIG_PACKAGE_kmod-nf-ipvs=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          
          # ========== LuCI ==========
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-network-zh-cn=y
          
          # ========== 网络工具 ==========
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          
          # ========== 系统 ==========
          CONFIG_PACKAGE_htop=y
          CONFIGEOF
          
          make defconfig

      - name: Verify config
        run: |
          echo "=== Target ==="
          grep "CONFIG_TARGET.*hailin" .config | grep "=y"
          echo ""
          echo "=== Key Packages ==="
          grep -E "ath9k|wpad|modemmanager|usb-serial|docker|sdhci|pcf8563|block-mount" .config | grep "=y"
          echo ""
          echo "=== DTS check ==="
          ls -la target/linux/ramips/dts/mt7621_hailin_hl7621-s.dts
          echo ""
          echo "=== mk tail ==="
          tail -15 target/linux/ramips/image/mt7621.mk

      - name: Download source packages
        run: make download -j$(nproc)

      - name: Build firmware
        id: build1
        continue-on-error: true
        run: |
          make -j$(nproc) 2>&1 | tail -100
        env:
          FORCE_UNSAFE_CONFIGURE: 1

      - name: Retry with verbose on failure
        if: steps.build1.outcome == 'failure'
        run: |
          echo "Build failed, retrying verbose..."
          make V=s -j1 2>&1 | tail -300
        env:
          FORCE_UNSAFE_CONFIGURE: 1

      - name: Collect artifacts
        run: |
          mkdir -p output
          cp -f bin/targets/ramips/mt7621/*hailin* output/ 2>/dev/null || true
          cp -f bin/targets/ramips/mt7621/*.manifest output/ 2>/dev/null || true
          
          if [ -z "$(ls -A output/*hailin* 2>/dev/null)" ]; then
            cp -f bin/targets/ramips/mt7621/*.bin output/ 2>/dev/null || true
          fi
          
          ls -lh output/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-hl7621-s-${{ github.event.inputs.branch }}-${{ github.run_id }}
          path: output/
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## 编译结果 - Hailin HL7621-S (FanchmWrt)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 源码: fanchmwrt/fanchmwrt" >> $GITHUB_STEP_SUMMARY
          echo "- 分支: ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- 设备: Hailin HL7621-S (MT7621AT, 256MB, 16MB Flash)" >> $GITHUB_STEP_SUMMARY
          echo "- WiFi: Atheros AR5BHB116 (AR9287) Mini PCIe 双频" >> $GITHUB_STEP_SUMMARY
          echo "- 4G: 移远 EC20/EC25 (USB)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "output" ] && [ "$(ls -A output/*.bin 2>/dev/null)" ]; then
            echo "### 状态: 编译成功" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            ls -lh output/*.bin | awk '{print "- " $NF " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          else
            echo "### 状态: 编译失败" >> $GITHUB_STEP_SUMMARY
          fi
