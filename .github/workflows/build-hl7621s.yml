name: Build OpenWrt HL7621-S
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Source
        uses: actions/checkout@v4
        repository: openwrt/openwrt
        ref: openwrt-24.10
        path: openwrt

      - name: Install Dependencies
        run: |
          cd openwrt
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3 python3-pip python3-setuptools python3-wheel rsync \
          swig unzip zlib1g-dev file wget

      - name: Add DTS & mt7621.mk
        run: |
          cd openwrt
          # 写入DTS文件
          cat > target/linux/ramips/dts/mt7621_hailin_hl7621-s.dts <<'EOF'
【粘贴上面完整DTS全部内容】
EOF
          # 追加设备定义到mt7621.mk
          cat >> target/linux/ramips/image/mt7621.mk <<'EOF'
# Hailin HL7621-S MT7621 16M Flash 256M DDR3
define Device/hailin_hl7621-s
  $(Device/mt7621)
  DEVICE_VENDOR := Hailin
  DEVICE_MODEL := HL7621-S
  DEVICE_DTS := mt7621_hailin_hl7621-s
  KERNEL_SIZE := 2560k
  DEVICE_PACKAGES := kmod-pcie-mt kmod-ath9k kmod-usb3 kmod-sdhci-mt7620 kmod-usb-net-rndis kmod-usb-net-cdc-ether kmod-i2c-gpio kmod-rtc-pcf8563 kmod-usb-serial option usb-modeswitch modem-power luci-app-modeminfo
endef
TARGET_DEVICES += hailin_hl7621-s
EOF
          # 写入开机脚本
          mkdir -p package/base-files/files/etc/init.d
          cat > package/base-files/files/etc/init.d/modem-power <<'EOF'
#!/etc/init.d/modem-power
START=99
STOP=01
start() {
	echo 13 > /sys/class/gpio/export
	echo out > /sys/class/gpio/gpio13/direction
	echo 1 > /sys/class/gpio/gpio13/value
	echo 19 > /sys/class/gpio/export
	echo out > /sys/class/gpio/gpio19/direction
	echo 0 > /sys/class/gpio/gpio19/value
	sleep 0.2
	echo 1 > /sys/class/gpio/gpio19/value
	echo "Modem Power On + PCIe PERST Reset OK"
}
stop() {
	echo 0 > /sys/class/gpio/gpio13/value
	echo 0 > /sys/class/gpio/gpio19/value
	echo 19 > /sys/class/gpio/unexport
	echo 13 > /sys/class/gpio/unexport
	echo "Modem Power Off"
}
EOF
          chmod +x package/base-files/files/etc/init.d/modem-power

      - name: Generate .config
        run: |
          cd openwrt
          make defconfig
          ./scripts/gen_config.py target ramips mt7621
          # 关键裁剪：关闭内核调试符号，所有外设驱动编译为模块M
          cat >> .config <<'EOF'
CONFIG_TARGET_ramips=y
CONFIG_TARGET_ramips_mt7621=y
CONFIG_TARGET_ramips_mt7621_DEVICE_hailin_hl7621-s=y
CONFIG_KERNEL_DEBUG_INFO=n
CONFIG_KERNEL_DEBUG_FS=n
CONFIG_KERNEL_KGDB=n
CONFIG_PACKAGE_kmod-pcie-mt=m
CONFIG_PACKAGE_kmod-ath9k=m
CONFIG_PACKAGE_kmod-usb3=m
CONFIG_PACKAGE_kmod-sdhci-mt7620=m
CONFIG_PACKAGE_kmod-i2c-gpio=m
CONFIG_PACKAGE_kmod-rtc-pcf8563=m
EOF
          make oldconfig

      - name: Compile OpenWrt
        run: |
          cd openwrt
          make -j$(nproc)

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-hl7621-firmware
          path: openwrt/bin/targets/ramips/mt7621/
